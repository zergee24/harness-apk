<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>生活交互体验 v2 · 离线设计查看器</title>
  <style>
    :root {
      color-scheme: light;
      --viewer-bg: #f0e8e5;
      --viewer-panel: #fffaf8;
      --viewer-panel-soft: #f8f0ed;
      --viewer-ink: #2a201e;
      --viewer-muted: #786761;
      --viewer-border: #dfd0cb;
      --viewer-coral: #c96f67;
      --viewer-coral-deep: #a9544d;
      --viewer-coral-soft: #f3d8d3;
      --viewer-green: #49705a;
      --viewer-shadow: 0 20px 60px rgba(72, 46, 40, 0.14);
      --phone-bg: #faf7f6;
      --phone-surface: #fffdfc;
      --phone-raised: #f5ecea;
      --phone-text: #211a19;
      --phone-muted: #765f5b;
      --phone-border: #e1d4d0;
      --phone-coral: #d98278;
      --phone-coral-deep: #b9635a;
      --phone-coral-soft: #fff0ed;
      --phone-primary-text: #fffdfc;
      --phone-success: #416d52;
      --phone-success-soft: #e7f0e8;
      --phone-warning: #8a5b2d;
      --phone-warning-soft: #fff3df;
      --phone-danger: #b54844;
      --phone-danger-soft: #fcebe9;
      --phone-overlay: rgba(33, 26, 25, 0.48);
      --phone-shadow: 0 22px 48px rgba(64, 43, 39, 0.2);
    }

    body[data-theme="dark"] {
      color-scheme: dark;
      --viewer-bg: #191516;
      --viewer-panel: #241d1b;
      --viewer-panel-soft: #302624;
      --viewer-ink: #fbf1ee;
      --viewer-muted: #cbb8b2;
      --viewer-border: #584641;
      --viewer-coral: #e5a097;
      --viewer-coral-deep: #f2b9b1;
      --viewer-coral-soft: #543532;
      --viewer-green: #a8d5b7;
      --viewer-shadow: 0 20px 60px rgba(0, 0, 0, 0.42);
      --phone-bg: #211a19;
      --phone-surface: #2d2422;
      --phone-raised: #382b29;
      --phone-text: #faf7f6;
      --phone-muted: #d3c1bc;
      --phone-border: #5d4a45;
      --phone-coral: #e5a097;
      --phone-coral-deep: #f0b8b0;
      --phone-coral-soft: #472e2b;
      --phone-primary-text: #291411;
      --phone-success: #a8d8b8;
      --phone-success-soft: #294536;
      --phone-warning: #f0c58c;
      --phone-warning-soft: #4a3926;
      --phone-danger: #ffb4ad;
      --phone-danger-soft: #4b2928;
      --phone-overlay: rgba(0, 0, 0, 0.62);
      --phone-shadow: 0 22px 48px rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--viewer-bg);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--viewer-ink);
      background: var(--viewer-bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Noto Sans SC", "PingFang SC", sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.45;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    select {
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--viewer-coral);
      outline-offset: 2px;
    }

    .viewer-shell {
      width: min(1320px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .viewer-header {
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
    }

    .viewer-eyebrow {
      margin: 0;
      color: var(--viewer-coral-deep);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .viewer-title {
      max-width: 760px;
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: -0.03em;
    }

    .viewer-description {
      max-width: 760px;
      margin: 0;
      color: var(--viewer-muted);
      font-size: 0.95rem;
    }

    .viewer-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 3px;
    }

    .viewer-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      color: var(--viewer-coral-deep);
      background: var(--viewer-coral-soft);
      border: 1px solid color-mix(in srgb, var(--viewer-coral) 32%, var(--viewer-border));
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .viewer-badge.viewer-badge-muted {
      color: var(--viewer-muted);
      background: var(--viewer-panel-soft);
      border-color: var(--viewer-border);
    }

    .viewer-controls {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px;
      background: var(--viewer-panel);
      border: 1px solid var(--viewer-border);
      border-radius: 18px;
      box-shadow: var(--viewer-shadow);
    }

    .viewer-control {
      display: grid;
      min-width: 0;
      gap: 5px;
    }

    .viewer-control-label {
      color: var(--viewer-muted);
      font-size: 0.72rem;
      font-weight: 500;
    }

    .viewer-select {
      min-width: 230px;
      min-height: 44px;
      padding: 8px 11px;
      color: var(--viewer-ink);
      background: var(--viewer-panel);
      border: 1px solid var(--viewer-border);
      border-radius: 10px;
    }

    .viewer-choice-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .viewer-choice {
      min-width: 50px;
      min-height: 44px;
      padding: 7px 10px;
      color: var(--viewer-muted);
      background: transparent;
      border: 1px solid var(--viewer-border);
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .viewer-choice.is-selected {
      color: var(--viewer-coral-deep);
      background: var(--viewer-coral-soft);
      border-color: var(--viewer-coral);
    }

    .viewer-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(252px, 292px);
      gap: 18px;
      align-items: start;
    }

    .viewer-stage,
    .viewer-index {
      min-width: 0;
      background: var(--viewer-panel);
      border: 1px solid var(--viewer-border);
      border-radius: 22px;
      box-shadow: var(--viewer-shadow);
    }

    .viewer-stage {
      display: grid;
      gap: 16px;
      padding: 18px;
    }

    .stage-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .stage-heading-copy {
      min-width: 0;
    }

    .stage-id {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      margin-bottom: 5px;
      padding: 4px 8px;
      color: var(--viewer-coral-deep);
      background: var(--viewer-coral-soft);
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .stage-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.2;
    }

    .stage-status {
      margin: 4px 0 0;
      color: var(--viewer-muted);
      font-size: 0.82rem;
    }

    .stage-tag-list {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      flex-wrap: wrap;
      max-width: 260px;
    }

    .stage-tag {
      padding: 5px 8px;
      color: var(--viewer-muted);
      background: var(--viewer-panel-soft);
      border: 1px solid var(--viewer-border);
      border-radius: 8px;
      font-size: 0.7rem;
    }

    .phone-stage {
      display: grid;
      place-items: start center;
      min-width: 0;
      padding: 24px 12px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--viewer-coral-soft) 58%, transparent), transparent 46%),
        var(--viewer-panel-soft);
      border: 1px solid var(--viewer-border);
      border-radius: 18px;
    }

    .notes-panel {
      display: grid;
      gap: 12px;
      padding: 14px;
      background: var(--viewer-panel-soft);
      border: 1px solid var(--viewer-border);
      border-radius: 14px;
    }

    .notes-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .notes-heading h3 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .notes-heading span {
      color: var(--viewer-muted);
      font-size: 0.72rem;
    }

    .notes-list {
      display: grid;
      gap: 10px;
      margin: 0;
    }

    .notes-item {
      display: grid;
      gap: 3px;
    }

    .notes-item dt {
      color: var(--viewer-coral-deep);
      font-size: 0.72rem;
      font-weight: 500;
    }

    .notes-item dd {
      margin: 0;
      color: var(--viewer-ink);
      font-size: 0.82rem;
    }

    .notes-actions {
      display: grid;
      gap: 7px;
      padding-top: 11px;
      border-top: 1px solid var(--viewer-border);
    }

    .notes-actions[hidden],
    .notes-feedback[hidden] {
      display: none;
    }

    .notes-actions-title {
      color: var(--viewer-coral-deep);
      font-size: 0.72rem;
      font-weight: 500;
    }

    .notes-action-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 48px;
      padding: 8px 10px;
      color: var(--viewer-ink);
      text-align: left;
      background: var(--viewer-panel);
      border: 1px solid var(--viewer-border);
      border-radius: 10px;
      font-size: 0.76rem;
    }

    .notes-action-button:hover {
      color: var(--viewer-coral-deep);
      background: var(--viewer-coral-soft);
      border-color: var(--viewer-coral);
    }

    .notes-action-button small {
      flex: 0 0 auto;
      color: var(--viewer-muted);
      font-size: 0.86em;
    }

    .notes-feedback {
      margin: 0;
      padding: 9px 10px;
      color: var(--viewer-muted);
      background: var(--viewer-panel-soft);
      border-radius: 10px;
      font-size: 0.76rem;
    }

    .viewer-index {
      position: sticky;
      top: 18px;
      padding: 16px;
    }

    .viewer-index h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 500;
    }

    .viewer-index-lead {
      margin: 5px 0 14px;
      color: var(--viewer-muted);
      font-size: 0.78rem;
    }

    .index-group {
      display: grid;
      gap: 5px;
      margin-top: 15px;
    }

    .index-group-title {
      color: var(--viewer-muted);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .index-button {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      width: 100%;
      min-height: 48px;
      padding: 7px 8px;
      color: var(--viewer-muted);
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
    }

    .index-button:hover,
    .index-button.is-selected {
      color: var(--viewer-coral-deep);
      background: var(--viewer-coral-soft);
      border-color: color-mix(in srgb, var(--viewer-coral) 35%, var(--viewer-border));
    }

    .index-button-id {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .index-button-title {
      overflow: hidden;
      font-size: 0.78rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
      color: var(--viewer-muted);
      font-size: 0.76rem;
    }

    .viewer-footer strong {
      color: var(--viewer-ink);
      font-weight: 500;
    }

    /* Product surface. The viewer controls stay outside this boundary. */
    .phone-shell {
      --phone-width: 420px;
      --phone-scale: 1;
      width: min(var(--phone-width), 100%);
      max-width: 100%;
      overflow: hidden;
      color: var(--phone-text);
      background: var(--phone-bg);
      border: 1px solid var(--phone-border);
      border-radius: 30px;
      box-shadow: var(--phone-shadow);
      font-size: calc(16px * var(--phone-scale));
      line-height: 1.4;
    }

    .phone-shell[data-width="320"] {
      --phone-width: 320px;
    }

    .phone-shell[data-width="360"] {
      --phone-width: 360px;
    }

    .phone-shell[data-width="420"] {
      --phone-width: 420px;
    }

    .phone-shell[data-scale="1"] {
      --phone-scale: 1;
    }

    .phone-shell[data-scale="1.3"] {
      --phone-scale: 1.3;
    }

    .phone-shell[data-scale="2"] {
      --phone-scale: 2;
    }

    .phone-systembar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 28px;
      padding: 6px 15px 3px;
      color: var(--phone-muted);
      background: var(--phone-surface);
      font-size: 0.68em;
    }

    .phone-system-icons {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.08em;
    }

    .phone-appbar {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 65px;
      padding: 8px 15px;
      background: var(--phone-surface);
      border-bottom: 1px solid var(--phone-border);
    }

    .phone-brand-mark {
      display: grid;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      place-items: center;
      color: var(--phone-coral-deep);
      background: var(--phone-coral-soft);
      border-radius: 12px;
      font-size: 0.94em;
    }

    .phone-title-wrap {
      display: grid;
      min-width: 0;
      flex: 1 1 auto;
      gap: 2px;
    }

    .phone-title {
      overflow: hidden;
      font-size: 0.94em;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .phone-subtitle {
      overflow: hidden;
      color: var(--phone-muted);
      font-size: 0.68em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .phone-sample-label {
      flex: 0 0 auto;
      color: var(--phone-coral-deep);
      font-size: 0.63em;
      font-weight: 500;
      white-space: nowrap;
    }

    .phone-icon-button,
    .phone-more-button {
      display: grid;
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      place-items: center;
      color: var(--phone-text);
      background: transparent;
      border: 0;
      border-radius: 13px;
      font-size: 1.08em;
    }

    .phone-icon-button:hover,
    .phone-more-button:hover {
      background: var(--phone-raised);
    }

    .phone-body {
      min-width: 0;
      padding: 20px 16px 24px;
      overflow-wrap: anywhere;
    }

    .phone-bottom-nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
      padding: 8px 12px 10px;
      background: var(--phone-surface);
      border-top: 1px solid var(--phone-border);
    }

    .phone-tab {
      display: grid;
      min-height: 50px;
      place-items: center;
      gap: 2px;
      color: var(--phone-muted);
      background: transparent;
      border: 0;
      border-radius: 12px;
      font-size: 0.72em;
    }

    .phone-tab.is-active {
      color: var(--phone-coral-deep);
      background: var(--phone-coral-soft);
      font-weight: 500;
    }

    .phone-tab-symbol {
      font-size: 1.28em;
      line-height: 1;
    }

    .phone-kicker {
      margin: 0 0 7px;
      color: var(--phone-coral-deep);
      font-size: 0.72em;
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    .phone-heading {
      margin: 0;
      font-size: 1.36em;
      font-weight: 500;
      line-height: 1.16;
      letter-spacing: -0.025em;
    }

    .phone-lead {
      margin: 8px 0 0;
      color: var(--phone-muted);
      font-size: 0.82em;
    }

    .home-action-list {
      display: grid;
      gap: 9px;
      margin-top: 22px;
    }

    .home-action {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 24px;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 70px;
      padding: 11px 12px;
      color: var(--phone-text);
      text-align: left;
      background: var(--phone-surface);
      border: 1px solid var(--phone-border);
      border-radius: 16px;
    }

    .home-action:hover {
      border-color: var(--phone-coral);
      background: var(--phone-raised);
    }

    .home-action.is-primary {
      color: var(--phone-primary-text);
      background: var(--phone-coral);
      border-color: var(--phone-coral);
    }

    .home-action.is-primary:hover {
      background: var(--phone-coral-deep);
      border-color: var(--phone-coral-deep);
    }

    .home-action-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      color: var(--phone-coral-deep);
      background: var(--phone-coral-soft);
      border-radius: 13px;
      font-size: 1.12em;
    }

    .home-action.is-primary .home-action-icon {
      color: var(--phone-text);
      background: rgba(255, 253, 252, 0.22);
    }

    .home-action-copy {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    .home-action-title {
      font-size: 0.88em;
      font-weight: 500;
    }

    .home-action-description {
      color: var(--phone-muted);
      font-size: 0.7em;
    }

    .home-action.is-primary .home-action-description {
      color: color-mix(in srgb, var(--phone-text) 78%, transparent);
    }

    .home-action-arrow {
      color: var(--phone-muted);
      font-size: 1em;
    }

    .home-action.is-primary .home-action-arrow {
      color: var(--phone-text);
    }

    .phone-section {
      margin-top: 24px;
    }

    .phone-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .phone-section-title {
      margin: 0;
      font-size: 0.88em;
      font-weight: 500;
    }

    .phone-section-link {
      min-height: 48px;
      padding: 8px 2px;
      color: var(--phone-coral-deep);
      background: transparent;
      border: 0;
      font-size: 0.7em;
      font-weight: 500;
    }

    .phone-section-caption {
      margin: 3px 0 0;
      color: var(--phone-muted);
      font-size: 0.67em;
    }

    .recent-group {
      display: grid;
      gap: 4px;
      margin-top: 15px;
    }

    .recent-group-title {
      margin: 0 0 1px;
      color: var(--phone-muted);
      font-size: 0.66em;
      font-weight: 500;
    }

    .recent-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      width: 100%;
      min-height: 55px;
      padding: 8px 0;
      color: var(--phone-text);
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--phone-border);
    }

    .recent-row:hover .recent-title {
      color: var(--phone-coral-deep);
    }

    .recent-copy {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    .recent-title {
      overflow: hidden;
      font-size: 0.75em;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-summary {
      overflow: hidden;
      color: var(--phone-muted);
      font-size: 0.62em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-status {
      flex: 0 0 auto;
      padding: 4px 6px;
      color: var(--phone-muted);
      border: 1px solid var(--phone-border);
      border-radius: 7px;
      font-size: 0.6em;
      white-space: nowrap;
    }

    .recent-status.is-draft {
      color: var(--phone-coral-deep);
      background: var(--phone-coral-soft);
      border-color: color-mix(in srgb, var(--phone-coral) 38%, var(--phone-border));
    }

    .recent-status.is-pending {
      color: var(--phone-warning);
      background: var(--phone-warning-soft);
      border-color: color-mix(in srgb, var(--phone-warning) 38%, var(--phone-border));
    }

    .empty-home {
      display: grid;
      gap: 9px;
      margin-top: 24px;
      padding: 22px 15px;
      text-align: center;
      background: var(--phone-surface);
      border: 1px dashed var(--phone-border);
      border-radius: 16px;
    }

    .empty-home-symbol {
      color: var(--phone-coral-deep);
      font-size: 1.35em;
    }

    .empty-home strong {
      font-size: 0.84em;
      font-weight: 500;
    }

    .empty-home span {

              <button class="attachment-state-action" type="button" data-goto="C02">取消</button>
            </div>
            <div class="attachment-state-row is-failed">
              <span class="file-mark" aria-hidden="true">图</span>
              <span class="attachment-state-copy"><span class="attachment-state-name">出门照片.jpg</span><span class="attachment-state-status is-failed">读取失败 · 可重选</span></span>
              <button class="attachment-state-action" type="button" data-goto="C02">重选</button>
            </div>
          </div>
          ${composer({
            draft: "下雨天带孩子出门，要准备什么？",
            attachmentEmpty: "附件状态未完成 · 文字草稿仍保留",
            helper: "文件读完或重新选择后，才能发送",
            disabled: true,
            sendTarget: "C05",
          })}
        </div>
        `;

      const renderH03 = () => `
        ${phoneTop("我的", "记录整理与草稿恢复", { home: true })}
        <div class="phone-body">
          <p class="phone-kicker">记录整理</p>
          <h1 class="phone-heading">最近聊过</h1>
          <p class="phone-lead">归档只是整理入口，记录可以撤销或从归档列表恢复。</p>
          <div class="history-manage-list" aria-label="整理记录">
            <div class="history-manage-row">
              <span class="history-manage-copy"><strong>周末去公园怎么安排？</strong><span>昨天 · 路线、补水和休息点的建议</span></span>
              <button class="history-archive" type="button" data-goto="H01">移到归档</button>
            </div>
            <div class="history-manage-row">
              <span class="history-manage-copy"><strong>晚饭想做得简单一点</strong><span>今天 · 20 分钟内完成的家常菜安排</span></span>
              <button class="history-archive" type="button" data-goto="H01">移到归档</button>
            </div>
          </div>
          <div class="undo-toast" role="status"><span>已移到归档 · 可撤销</span><button type="button" data-goto="H01">撤销</button></div>
          <div class="archive-recovery">
            <span class="archive-recovery-copy"><strong>归档列表</strong><span>原记录、草稿和身份仍可恢复</span></span>
            <button class="history-archive" type="button" data-goto="H01">恢复</button>
          </div>
          <div class="draft-banner">
            <span class="draft-banner-copy"><span class="draft-banner-title">未完成草稿仍在</span><span class="draft-banner-detail">周末出行要带什么？</span></span>
            <button class="product-button primary" type="button" data-goto="C01">继续</button>
          </div>
        </div>
        ${phoneBottom("me")}`;

      const renderPhone = (id) => {
        switch (id) {
          case "H02": return renderEmptyHome();
          case "H03": return renderH03();
          case "H04": return renderH04();
          case "C01": return renderC01();
          case "C02": return renderC02();
          case "C03": return renderC03();
          case "C04": return renderC04();
          case "C05": return renderC05();
          case "C06": return renderC06();
          case "C07": return renderC07();
          case "C08": return renderC08();
          case "C09": return renderC09();
          case "C10": return renderC10();
          case "C11": return renderC11();
          case "C12": return renderC12();
          case "C13": return renderC13();
          case "C14": return renderC14();
          case "H01":
          default: return renderHome();
        }
      };

      const renderNotes = (screen) => {
        notesId.textContent = `对应 ${screen.id}`;
        notesList.innerHTML = `
          <div class="notes-item"><dt>布局标注</dt><dd>${escapeHtml(screen.notes.layout)}</dd></div>
          <div class="notes-item"><dt>状态规则</dt><dd>${escapeHtml(screen.notes.rule)}</dd></div>
          <div class="notes-item"><dt>对应状态 ID</dt><dd>${escapeHtml(screen.notes.id)}</dd></div>`;
        notesActions.hidden = screen.id !== "C09";
        notesActions.innerHTML = screen.id === "C09" ? `
          <span class="notes-actions-title">重新确认结果 · 查看器演示控制（不属于手机）</span>
          <button class="notes-action-button" type="button" data-goto="C05"><span>确认已落地 · 查看生成中</span><small>C05 ›</small></button>
          <button class="notes-action-button" type="button" data-goto="C11"><span>确认未落地 · 查看可编辑重试</span><small>C11 ›</small></button>
          <button class="notes-action-button" type="button" data-goto="C09"><span>仍无法确认 · 保持待确认</span><small>C09 ↻</small></button>` : "";
        notesFeedback.hidden = true;
        notesFeedback.textContent = "";
      };

      const updateUrl = () => {
        const params = new URLSearchParams();
        params.set("screen", state.screen);
        params.set("width", state.width);
        params.set("scale", state.scale);
        params.set("theme", state.theme);
        try {
          window.history.replaceState(null, "", `${window.location.pathname}?${params.toString()}`);
        } catch (error) {
          // file:// viewers may disallow history updates; state remains usable in memory.
        }
      };

      const renderStage = () => {
        const screen = screenById(state.screen);
        document.body.dataset.theme = state.theme;
        viewer.dataset.theme = state.theme;
        phone.dataset.theme = state.theme;
        phone.dataset.width = state.width;
        phone.dataset.scale = state.scale;
        phone.innerHTML = renderPhone(screen.id);
        stageId.textContent = screen.id;
        stageTitle.textContent = screen.label;
        stageStatus.textContent = screen.status;
        stageTags.innerHTML = screen.tags.map((tag) => `<span class="stage-tag">${escapeHtml(tag)}</span>`).join("");
        screenSelect.value = screen.id;
        renderNotes(screen);
        document.querySelectorAll("[data-width-choice]").forEach((button) => {
          const selected = button.dataset.widthChoice === state.width;
          button.classList.toggle("is-selected", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
        document.querySelectorAll("[data-scale-choice]").forEach((button) => {
          const selected = button.dataset.scaleChoice === state.scale;
          button.classList.toggle("is-selected", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
        document.querySelectorAll("[data-theme-choice]").forEach((button) => {
          const selected = button.dataset.themeChoice === state.theme;
          button.classList.toggle("is-selected", selected);
          button.setAttribute("aria-pressed", String(selected));
        });
        document.querySelectorAll("[data-index-id]").forEach((button) => {
          const selected = button.dataset.indexId === state.screen;
          button.classList.toggle("is-selected", selected);
          button.setAttribute("aria-current", selected ? "page" : "false");
        });
      };

      const renderIndex = () => {
        const groups = ["首页", "聊天"];
        stateIndex.innerHTML = groups.map((group) => `
          <div class="index-group">
            <span class="index-group-title">${group}</span>
            ${screens.filter((screen) => screen.group === group).map((screen) => `
              <button class="index-button" type="button" data-index-id="${screen.id}" aria-current="${screen.id === state.screen ? "page" : "false"}">
                <span class="index-button-id">${screen.id}</span>
                <span class="index-button-title">${escapeHtml(screen.label)}</span>
              </button>`).join("")}
          </div>`).join("") + `
          <div class="index-group">
            <span class="index-group-title">附屏</span>
            <button class="index-button" type="button" data-index-id="H03" aria-current="${state.screen === "H03" ? "page" : "false"}">
              <span class="index-button-id">H03</span>
              <span class="index-button-title">整理记录 · 撤销归档</span>
            </button>
          </div>`;
      };

      const renderSheet = (kind) => {
        const isChat = kind === "chat";
        const isRecovery = kind === "recovery";
        const ids = isRecovery
          ? ["C04", "C08", "C09", "C11"]
          : isChat
            ? ["C01", "C02", "C05", "C06"]
            : ["H01", "H02", "H03", "H04"];
        const title = isRecovery ? "聊天恢复状态总览" : isChat ? "聊天状态总览" : "生活首页总览";
        const description = isRecovery
          ? "展示 FINALIZING、生成失败、UNKNOWN 与确认未落地四种恢复边界；示意分支都保留问题，不代表真实请求结果。"
          : isChat
            ? "从空聊天、附件确认到生成中与成功答案，展示一条可恢复的聊天主链。C03 / C04 / C07–C14 可在查看器状态索引或恢复示意图中打开。"
            : "从有记录首页、空首页到整理撤销和读取失败，展示简洁模式的入口与找回路径。示意只用于设计评审。";
        viewer.classList.add("sheet-mode");
        document.body.classList.add("sheet-mode");
        document.querySelector(".viewer-header").classList.add("spec-hidden");
        document.querySelector(".viewer-main").classList.add("spec-hidden");
        document.querySelector(".viewer-footer").classList.add("spec-hidden");
        sheetRoot.classList.remove("spec-hidden");
        sheetRoot.innerHTML = `
          <div class="sheet-heading">
            <div>
              <p class="sheet-kicker">生活交互体验 v2 · 离线示意</p>
              <h1>${title}</h1>
              <p>${description}</p>
            </div>
            <span class="sheet-flag">示例数据 · 无真实请求</span>
          </div>
          <div class="sheet-grid${isChat || isRecovery ? " chat-sheet" : ""}">
            ${ids.map((id) => {
              const screen = screenById(id);
              return `
                <article class="sheet-card" aria-labelledby="sheet-${id}">
                  <div class="sheet-card-heading"><strong>${id}</strong><span id="sheet-${id}">${escapeHtml(screen.label)}</span></div>
                  <div class="sheet-phone-wrap">
                    <div class="phone-shell sheet-phone" data-width="${isChat ? "360" : "360"}" data-scale="1" data-theme="${state.theme}">${renderPhone(id)}</div>
                  </div>
                </article>`;
            }).join("")}
          </div>`;
      };

      const initControls = () => {
        screenSelect.innerHTML = screens.map((screen) => `<option value="${screen.id}">${screen.id} · ${escapeHtml(screen.label)}</option>`).join("");
        screenSelect.addEventListener("change", (event) => {
          state.screen = event.target.value;
          updateUrl();
          renderIndex();
          renderStage();
        });
        document.addEventListener("click", (event) => {
          const demoTarget = event.target.closest("[data-demo-action]");
          if (demoTarget) {
            const feedback = {
              copy: "查看器示意：复制按钮已画出，但未访问剪贴板。",
              read: "查看器示意：朗读按钮已画出，但未启动语音播放。",
              "remove-attachment": "查看器示意：附件移除入口已画出，未修改真实草稿。",
            }[demoTarget.dataset.demoAction];
            if (feedback) {
              notesFeedback.textContent = feedback;
              notesFeedback.hidden = false;
            }
            return;
          }
          const target = event.target.closest("[data-goto]");
          if (target) {
            if (target.dataset.action === "cancel-voice") {
              state.draft = voiceDraftBaseline;
              state.voiceMerged = false;
            }
            if (target.dataset.action === "merge-transcript") {
              state.transcriptDraft = state.transcriptDraft.trim();
              state.draft = `${voiceDraftBaseline}\n${state.transcriptDraft || voiceTranscript}`;
              state.voiceMerged = true;
            }
            const next = target.dataset.goto;
            if (screens.some((screen) => screen.id === next)) {
              state.screen = next;
              updateUrl();
              renderIndex();
              renderStage();
            }
            return;
          }
          const indexTarget = event.target.closest("[data-index-id]");
          if (indexTarget) {
            state.screen = indexTarget.dataset.indexId;
            updateUrl();
            renderIndex();
            renderStage();
            return;
          }
          const widthTarget = event.target.closest("[data-width-choice]");
          if (widthTarget) {
            state.width = widthTarget.dataset.widthChoice;
            updateUrl();
            renderStage();
            return;
          }
          const scaleTarget = event.target.closest("[data-scale-choice]");
          if (scaleTarget) {
            state.scale = scaleTarget.dataset.scaleChoice;
            updateUrl();
            renderStage();
            return;
          }
          const themeTarget = event.target.closest("[data-theme-choice]");
          if (themeTarget) {
            state.theme = themeTarget.dataset.themeChoice;
            updateUrl();
            renderStage();
          }
        });
        document.addEventListener("input", (event) => {
          if (event.target.matches("[data-draft-input]")) {
            state.draft = event.target.value;
          }
          if (event.target.matches("[data-transcript-input]")) {
            state.transcriptDraft = event.target.value;
          }
        });
        document.addEventListener("keydown", (event) => {
          if (event.target.matches("input, textarea, select, [contenteditable='true']")) return;
          if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
            event.preventDefault();
            const current = screens.findIndex((screen) => screen.id === state.screen);
            const nextIndex = event.key === "ArrowRight"
              ? (current + 1) % screens.length
              : (current - 1 + screens.length) % screens.length;
            state.screen = screens[nextIndex].id;
            updateUrl();
            renderIndex();
            renderStage();
          }
        });
      };

      initControls();
      renderIndex();
      const sheetKind = query.get("sheet");
      if (sheetKind === "home" || sheetKind === "chat" || sheetKind === "recovery") {
        renderSheet(sheetKind);
      } else {
        renderStage();
      }
    })();
  </script>
</body>
</html>
